name: Mac HappyLulu

on:
  push:
    branches: [main, 'cy-agent/**', 'codex/**']
    paths:
      - 'Sources/**'
      - 'windows/HappyLulu.Core/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'windows/HappyLulu.Core/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'RELEASE-NOTES.md'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      # CI verifies packaging without accessing a developer's signing keys.
      HAPPY_LULU_SIGNING_IDENTITY: '-'
      QA_REPORT_DIR: .build/qa/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts and app metadata
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          plutil -lint Resources/Info.plist
          git diff --check
          python3 scripts/check-release-delivery.py
      - name: Check QA runner reporting
        run: |
          python3 scripts/check-qa-runner.py
          python3 -B -m unittest discover -s scripts/tests -p 'test_ai_usage_ui_cli.py' -v
      - name: Run full isolated QA pipeline
        run: python3 scripts/run-qa.py --profile full --report-dir "$QA_REPORT_DIR"
      - name: Publish QA job summary
        if: always()
        run: |
          if [[ -f "$QA_REPORT_DIR/summary.md" ]]; then
            cat "$QA_REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'QA report unavailable: pipeline did not start or report creation failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload QA report, logs and synthetic render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HappyLulu-qa-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.QA_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Package and verify Universal app without private keys
        run: |
          bash scripts/package-release.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          python3 scripts/verify-release.py "dist/releases/$version-build$build"
          echo "RELEASE_DIR=dist/releases/$version-build$build" >> "$GITHUB_ENV"
      - name: Check Sparkle configuration without private keys
        run: swift run --build-system native AppUpdateChecks "$RELEASE_DIR/happylulu.app" --configuration-only
      - uses: actions/upload-artifact@v4
        with:
          name: HappyLulu-macos-unsigned-for-distribution-${{ github.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/*.zip
            ${{ env.RELEASE_DIR }}/*.dmg
            ${{ env.RELEASE_DIR }}/*.md
            ${{ env.RELEASE_DIR }}/LICENSE
            ${{ env.RELEASE_DIR }}/build-source.json
            ${{ env.RELEASE_DIR }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
