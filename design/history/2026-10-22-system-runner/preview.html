<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>happylulu · 시스템 러너 확인</title><style>body{margin:0;background:#f6f5f9;color:#292536;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1000px;margin:36px auto;padding:0 24px}h1{font-size:28px}p{color:#635c70;line-height:1.7}.card{background:white;padding:24px;margin:22px 0;border-radius:18px}img{max-width:100%;height:auto}.grid{display:flex;gap:24px;flex-wrap:wrap}.grid>div{flex:1;min-width:300px}.panel{width:364px}.small{font-size:13px}a{color:#5f47a5}</style><main><h1>happylulu 시스템 러너</h1><p>실제 앱 코드로 그린 화면과 애니메이션입니다. 수치는 합성 검사값이며 내 컴퓨터의 실시간 수치가 아닙니다.</p><section class="card"><h2>원본 고양이와 기존 친구들</h2><img src="frames/runner-preview.gif" alt="햄스터 토끼와 공식 RunCat 고양이의 실제 프레임 애니메이션"><p class="small">공식 RunCat 고양이 5프레임 · 고정 10fps 미리보기<br><a href="https://github.com/Kyome22/menubar_runcat">원본과 라이선스</a></p></section><section class="card"><h2>부엉이와 러너를 한 메뉴바 항목으로</h2><p><img src="integration/status-button-light-normal-on-surface.png" alt="밝은 메뉴바: 부엉이 고양이 시간과 Codex 아이콘 한 묶음"></p><p><img src="integration/status-button-dark-normal-on-surface.png" alt="어두운 메뉴바 한 묶음"></p><div class="grid"><div><img class="panel" src="integration/panel-light.png" alt="시스템 전체 수치가 있는 밝은 출퇴근 패널"></div><div><img class="panel" src="integration/panel-dark.png" alt="어두운 출퇴근 패널"></div></div></section><section class="card"><h2>시스템 러너 설정</h2><img src="settings/runner-settings-ko-light-cat.png" alt="시스템 러너 한국어 설정"></section><section class="card"><h2>Codex 글자 또는 아이콘</h2><img src="integration/usage-settings-light.png" alt="Codex 표시 방식 선택"></section><section class="card"><h2>원본 프레임 확인</h2><img src="frames/runner-frames-light.png" alt="동물별 실제 프레임 배열"></section></main></html>
